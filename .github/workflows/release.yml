# Release workflow — MIRRORS scripts/release.ps1 (proven locally first; no wasted CI credits).
# Manual trigger ONLY (workflow_dispatch): pick "Run workflow" in the Actions tab to build.
# It builds the Windows EXE, assembles the shippable zip (exe + shaders + python kit; NO packs or
# game-derived data — see LICENSE-NOTES.md), uploads it as a run artifact, AND publishes a GitHub
# Release so the exe is hosted on the Releases page. GitHub runners have no usable GPU, so the only
# smoke here is --version (the render smoke stays a local step).
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = auto: v<version>-<short-sha>)"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        # Stable by default so /releases/latest works and existing installs can reliably discover
        # urgent fixes. Callers can still opt into a prerelease for experimental builds.
        default: false

permissions:
  contents: write # create the Release + tag

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Third-party actions are pinned to COMMIT SHAS, not tags (CodeQL actions/unpinned-tag).
      # This workflow publishes the exe users download, so a moved tag in any of these repos
      # would run someone else's code with release-publishing credentials. The comment names the
      # tag each SHA was resolved from; bump by re-resolving the tag, never by trusting it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-06
        with:
          # Pinned by SHA, the ref no longer names the toolchain — say it explicitly.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build (locked, build-paths remapped)
        shell: powershell
        # build-clean.ps1 remaps the runner's CARGO_HOME + workspace prefixes out of the binary
        # (trim-paths is unstable on the pinned cargo) so the published exe carries no build-machine
        # paths, and re-applies +crt-static (RUSTFLAGS overrides .cargo/config.toml).
        run: .\scripts\build-clean.ps1 -Locked
      - name: Version smoke (runners have no GPU)
        run: .\target\release\atlas.exe --version
      - name: Assemble dist (skip build + render smoke; done above / GPU-only)
        shell: powershell
        run: .\scripts\release.ps1 -Full -SkipBuild -SkipRenderSmoke
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            ver=$(grep -m1 -E '^version' viewer/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            tag="v${ver}-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-win64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Atlas ${{ steps.meta.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
